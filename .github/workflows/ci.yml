name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done
      - name: Check Python syntax
        run: |
          python3 -m py_compile tools/*.py image/rootfs-overlay/usr/local/lib/bobcat-miner/*.py
